<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <title>Books — Playlog</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/books.css">
  <script>(function(){var t=localStorage.getItem('pl-visual-theme')||'library';document.documentElement.setAttribute('data-visual-theme',t);})()</script>
</head>
<body class="home-page books-page">
  <div class="app-container">
    <main class="page">
      <header class="page-header">
        <h1 class="page-title" id="books-brand">Playlog</h1>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="stats-pill-btn" id="btn-stats" type="button" title="Your Reading Stats &amp; Wrapped">Stats</button>
          <a href="/account.html" class="icon-btn acct-btn" id="btn-account" title="Settings"><span class="acct-avatar" id="acct-avatar"></span></a>
        </div>
      </header>

      <div class="type-pills has-3" id="type-pills">
        <button class="type-pill" data-tab="media" type="button">Movies</button>
        <button class="type-pill" data-tab="games" type="button">Games</button>
        <button class="type-pill active" data-tab="books" type="button">Books</button>
      </div>

      <section id="bk-hero" class="bk-hero"></section>

      <p class="section-title" style="margin-top:24px">My Shelves</p>
      <div class="bk-folder-grid" id="bk-folders" role="group" aria-label="Book folders"></div>

      <div class="bk-head bk-library-head">
        <p class="section-title" id="bk-shelf-heading" style="margin:0 !important">Library</p>
        <div class="bk-head-actions">
          <button class="btn btn-ghost bk-sm bk-random-btn" id="bk-random" type="button" style="display:none" title="Pick a random unread book">🎲 Pick one</button>
          <div class="toggle-pair bk-view" id="bk-view" aria-label="Library view">
            <button class="toggle-btn" type="button" data-view="grid" aria-label="Grid view" title="Grid view">▦</button>
            <button class="toggle-btn" type="button" data-view="list" aria-label="List view" title="List view">☰</button>
          </div>
        </div>
      </div>

      <div class="bk-bar bk-library-bar">
        <label class="bk-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
          <input id="bk-q" class="input-field" placeholder="Search books, authors, or series…" aria-label="Search books, authors, or series">
        </label>
        <div class="bk-controls">
          <select id="bk-sort" class="input-field" aria-label="Sort books">
            <option value="recent">Recently added</option>
            <option value="title">A–Z</option>
            <option value="rating">Top rated</option>
            <option value="pages">Longest</option>
            <option value="finished">Recently finished</option>
          </select>
        </div>
      </div>

      <div id="bk-grid" class="bk-grid"></div>

      <a class="bk-stats-banner" id="bk-stats-banner" href="/stats.html?tab=books">
        <div>
          <b>Reading Stats &amp; Books Wrapped</b>
          <span>Pages, reading pace, top authors &amp; recap cards</span>
        </div>
        <span aria-hidden="true">→</span>
      </a>
    </main>
  </div>

  <button class="fab" id="fab-add"><span>+</span> Add Book</button>
  <input type="file" id="bk-file" accept=".txt,text/plain" hidden>
  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/theme-engine.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/js/trophies.js"></script>
  <script src="/js/account.js"></script>
  <script src="/js/openlibrary.js"></script>
  <script src="/js/books.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    window.addEventListener('pageshow', function (e) { if (e.persisted) window.location.reload(); });
  </script>
</body>
</html>
