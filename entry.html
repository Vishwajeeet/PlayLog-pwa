<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <title>Entry — Playlog</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/home.css">
</head>

<body>
  <div class="app-container">
    <main class="page">
      <div class="brand-bar" id="brand-bar"><span>Playlog</span></div>

      <div class="page-header">
        <button id="btn-back" class="back-btn">←</button>
        <h1 class="page-title">Details</h1>
        <div style="width:40px"></div>
      </div>

      <div id="entry-content">
        <div class="skeleton" style="height:340px;border-radius:16px;margin-bottom:16px"></div>
        <div class="skeleton" style="height:28px;width:70%;border-radius:6px;margin-bottom:10px"></div>
        <div class="skeleton" style="height:16px;width:40%;border-radius:6px;margin-bottom:20px"></div>
        <div class="skeleton" style="height:180px;border-radius:14px"></div>
      </div>

    </main>
  </div>

  <div id="toast" class="toast"></div>
  <!-- Move to Playlist -->
  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <p class="modal-title">Move to Playlist</p>
      <div id="move-playlist-list" style="max-height:320px;overflow-y:auto;margin:16px 0"></div>
      <button class="btn btn-ghost" id="btn-cancel-move">Cancel</button>
    </div>
  </div>

  <!-- Share Entry -->
  <div class="modal-overlay" id="share-modal">
    <div class="modal-box">
      <p class="modal-title">Share Entry</p>
      <div id="share-canvas-wrap" style="margin:16px 0"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-close-share">Close</button>
        <button class="btn btn-primary" id="btn-download-share">↓ Download</button>
      </div>
    </div>
  </div>
  <!-- Delete Confirm -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
      <p class="modal-title">Delete this entry?</p>
      <p style="color:var(--text-muted);margin-bottom:24px">This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-cancel-delete">Cancel</button>
        <button class="btn btn-danger" id="btn-confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/js/flow.js"></script>
  <script src="/js/entry.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
    <script>
    var brandBar = document.getElementById('brand-bar');
    if (brandBar) brandBar.addEventListener('click', function () {
      window.location.href = '/home.html';
    });
  </script>
</body>

</html>
