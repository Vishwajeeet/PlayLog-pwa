<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <title>Add — Playlog</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/home.css">
</head>

<body>

  <div class="app-container">
    <main class="page">

      <div class="brand-bar" id="brand-bar"><span>Playlog</span></div>

      <div id="toast" class="toast"></div>

      <!-- STEP 1: SEARCH -->
      <div id="step-1" class="step active">

        <div class="page-header">
          <button id="btn-back-s1" class="back-btn">←</button>
          <h1 class="page-title" id="step1-heading">What did you watch?</h1>
        </div>

        <div class="media-type-tabs">
          <button id="btn-movie" class="media-tab active" data-type="movie">🎬 Movie</button>
          <button id="btn-series" class="media-tab" data-type="series">📺 Series</button>
          <button id="btn-game" class="media-tab" data-type="game"> Game</button>
        </div>
        <script>
          (function () {
            var t = new URLSearchParams(window.location.search).get('type');
            if (!t) return;
            document.querySelectorAll('.media-tab').forEach(function (btn) {
              var isGameTab = btn.dataset.type === 'game';
              btn.style.display = (t === 'game') === isGameTab ? '' : 'none';
              btn.classList.toggle('active', (t === 'game') === isGameTab);
            });
            if (t === 'game') {
              var wrap = document.querySelector('.media-type-tabs');
              if (wrap) wrap.style.display = 'none';
            }
          })();
        </script>

        <button id="pl-chip" class="pl-chip" type="button" style="display:none"></button>

        <input type="text" id="search-input" class="input-field" placeholder="Search for a title..."
          style="margin-bottom:8px">

        <div id="search-status" class="text-sm text-muted" style="margin:8px 0"></div>
        <div id="search-results" class="results-list"></div>

      </div>

      <!-- STEP 2: SEASON PICKER (series only) -->
      <div id="step-2" class="step">

        <div class="page-header">
          <button id="btn-back-s2" class="back-btn">←</button>
          <h1 class="page-title">Pick a season</h1>
        </div>

        <div id="seasons-list"></div>

      </div>

      <!-- STEP 3: DETAILS -->
      <div id="step-3" class="step">

        <div class="page-header">
          <button id="btn-back-s3" class="back-btn">←</button>
          <h1 class="page-title">Almost done</h1>
        </div>

        <div class="preview-row">
          <img id="preview-poster" class="preview-poster-img" alt="Poster">
          <div class="preview-info">
            <h2 id="preview-title" class="preview-title"></h2>
            <p id="preview-sub" class="text-sm text-muted"></p>
          </div>
        </div>

        <!-- MOVIE/SERIES FIELDS -->
        <div id="movie-series-fields">
          <label class="label">When did you watch it?</label>
          <select id="year-select" class="input-field" style="margin-bottom:12px"></select>
          <div class="month-scroll" id="month-chips"></div>

          <label class="label">How was it?</label>
          <div class="emoji-row" id="emoji-row"></div>
        </div>

        <!-- GAME FIELDS -->
        <div id="game-fields" style="display:none">

          <label class="label">Completion Status *</label>
          <div class="completion-grid" id="completion-row">
            <button class="completion-btn" data-status="completed"> Completed</button>
            <button class="completion-btn" data-status="playing"> Playing</button>
            <button class="completion-btn" data-status="dropped">Dropped</button>
            <button class="completion-btn" data-status="wishlist"> Wishlist</button>
          </div>

          <div id="game-extra-fields">
            <label class="label" style="margin-top:20px">Rating (1–10)</label>
            <div class="number-rating-row" id="number-rating-row"></div>

            <label class="label" style="margin-top:20px">When did you play it?</label>
            <select id="game-year-select" class="input-field" style="margin-bottom:12px"></select>
            <div class="month-scroll" id="game-month-chips"></div>

            <label class="label" style="margin-top:4px">Hours Played (optional)</label>
            <input type="number" id="playtime-input" class="input-field" placeholder="e.g. 47" min="0" max="9999"
              style="margin-bottom:16px">



            <label class="label">Your Review (optional)</label>
            <textarea id="review-input" class="input-field" placeholder="What did you think?" rows="3"
              style="resize:none;margin-bottom:16px"></textarea>

            <label class="label" id="reason-label" style="display:none">Reason for dropping (optional)</label>
            <textarea id="reason-input" class="input-field" placeholder="Why did you drop it?" rows="2"
              style="display:none;resize:none;margin-bottom:16px"></textarea>
          </div>

        </div>

        <button id="btn-add" class="btn btn-primary" disabled>Add to Collection</button>

      </div>

    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/js/flow.js"></script>
  <script src="/js/tmdb.js"></script>
  <script src="/js/rawg.js"></script>
  <script src="/js/add.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
    <script>
    var brandBar = document.getElementById('brand-bar');
    if (brandBar) brandBar.addEventListener('click', function () {
      window.location.href = '/home.html';
    });
  </script>
</body>

</html>
