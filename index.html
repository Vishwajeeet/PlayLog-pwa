<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="theme-color" content="#0d0d0d">

  <title>Playlog — Login</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/home.css">
</head>

<body class="login-screen">

  <div class="login-shell">

    <div class="login-emoji">
      🎬
    </div>

    <h1 class="login-heading">
      Playlog
    </h1>

    <p class="login-tagline">
      Your personal media diary.
    </p>

    <button
      id="btn-google"
      class="btn btn-primary"
    >
      Continue with Google
    </button>

    <p class="login-footer-text">
      Private & synced across all your devices
    </p>

  </div>

  <div id="toast" class="toast"></div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Shared scripts -->
  <script src="/js/config.js"></script>
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/firestore.js"></script>
  <script src="/js/tmdb.js"></script>
  <script src="/js/rawg.js"></script>

  <script>
    AppAuth.onAuthReady(function(user) {

      if (user) {
        window.location.href = '/home.html';
      }

    });

    document
      .getElementById('btn-google')
      .addEventListener('click', function() {

        var btn =
          document.getElementById('btn-google');

        btn.disabled = true;
        btn.textContent = 'Signing in...';

        AppAuth
          .signInWithGoogle()
          .then(function() {

            window.location.href =
              '/home.html';

          })
          .catch(function(err) {

            console.error(err);

            btn.disabled = false;

            btn.textContent =
              'Continue with Google';

            AppUtils.showToast(
              'Sign in failed. Try again.'
            );

          });

      });
  </script>

  <!-- PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
